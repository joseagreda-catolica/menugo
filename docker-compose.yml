services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menugo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menugo}
      POSTGRES_DB: ${POSTGRES_DB:-menugo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - menugo_db_data:/var/lib/postgresql/data

volumes:
  menugo_db_data:
